<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-area"></div>
    <div class="info-display">
        <div class="length-display">Uzunluk: 1</div>
        <div id="autopilotIndicator">
            (A) Auto pilot: <span id="autopilotStatus">Kapalı</span>
        </div>
    </div>
    <!-- Sol alt köşedeki hız göstergesi -->
    <div class="speed-display">
        Hız:
        <div class="speed-bars" id="speedBars">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </div>
    <!-- Sağ alt köşedeki sayaç -->
    <div class="timer-display">Süre: 10</div>
    <script src="script.js"></script>
</body>

</html>
